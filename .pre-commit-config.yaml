---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
        exclude: ".clang-format"
      - id: end-of-file-fixer
  #  - repo: https://github.com/pocc/pre-commit-hooks
  #    rev: v1.4.0
  #    hooks:
  #      - id: clang-tidy
  #        args: [ "--fix", "-p=build/" ]
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.1
    hooks:
      - id: clang-format
